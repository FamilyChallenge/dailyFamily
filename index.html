<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le défi du jour</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#5b4b8a" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎁 Le défi du jour</h1>
  </header>

  <main>
    <!-- Écran de connexion : visible uniquement si personne n'est connecté -->
    <section class="card" id="login-section">
      <h2>Connexion</h2>
      <form id="login-form">
        <select id="login-name-select"></select>
        <input id="login-pin-input" type="password" inputmode="numeric" placeholder="Code PIN" />
        <button type="submit">Se connecter</button>
      </form>
      <p id="login-error" class="error hidden">Nom ou PIN incorrect.</p>
    </section>

    <!-- Contenu principal : visible uniquement une fois connecté -->
    <div id="app-content" class="hidden">
      <section class="card" id="logged-in-as">
        <span id="current-user-name"></span>
        <div>
          <button id="enable-notif-btn" type="button" class="icon-btn">🔔 Notifications</button>
          <button id="logout-btn" type="button" class="icon-btn">Se déconnecter</button>
        </div>
      </section>

      <section class="card" id="today-challenge-section">
        <h2>Défi du jour</h2>
        <div id="today-challenge"></div>
      </section>

      <section class="card">
        <h2>📜 Fil des 7 derniers jours</h2>
        <div id="history-list"></div>
      </section>
    </div>

    <!-- Panneau admin : gestion des participants, protégé par mot de passe -->
    <section class="card" id="admin-section">
      <h2>Gestion des participants (admin)</h2>
      <div id="admin-locked">
        <button id="unlock-admin-btn" type="button">🔒 Déverrouiller</button>
      </div>

      <div id="admin-panel" class="hidden">
        <h3>Participants</h3>
        <ul id="participants-list"></ul>
        <form id="add-participant-form">
          <input id="new-participant-name" type="text" placeholder="Nom du participant" />
          <input id="new-participant-pin" type="text" inputmode="numeric" placeholder="Code PIN (4 chiffres)" />
          <button type="submit">Ajouter</button>
        </form>
        <p id="admin-debug" class="error hidden"></p>

        <h3>Catégories du jeu</h3>
        <ul id="categories-list"></ul>
        <form id="add-category-form">
          <input id="new-category-name" type="text" placeholder="Nouvelle catégorie" />
          <button type="submit">Ajouter</button>
        </form>
        <p id="categories-debug" class="error hidden"></p>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
